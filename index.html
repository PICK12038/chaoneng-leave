<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<title>超能班 · 周末请假台</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark">超</div>
      <div class="brand-text">
        <div class="brand-name">周末请假台</div>
        <div class="brand-sub" id="brandSub">周六超能班</div>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div class="me" id="meBtn" data-action="editMe" title="修改我的称呼">
        <span class="avatar" id="meAvatar">?</span>
        <span class="me-text">
          <span class="me-name" id="meName">未设置称呼</span>
          <span class="me-role">协作成员</span>
        </span>
      </div>
      <div class="sync" id="syncLine"><i class="dot"></i><span>正在连接…</span></div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="topbar-left">
        <button class="icon-btn only-mobile" data-action="toggleNav" aria-label="菜单">
          <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <div>
          <div class="page-title" id="pageTitle">本周名单</div>
          <div class="page-sub" id="pageSub">—</div>
        </div>
      </div>
      <div class="topbar-right">
        <div class="presence" id="presence"></div>
        <button class="btn ghost" data-action="exportMenu">
          <svg viewBox="0 0 24 24"><path d="M12 3v12m0 0 4-4m-4 4-4-4M4 21h16"/></svg>
          导出
        </button>
        <button class="btn primary" data-action="newRecord">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
          添加请假
        </button>
      </div>
    </header>
    <div class="view" id="view">
      <div class="boot-wait">
        <div class="spinner"></div>
        <div class="boot-title">正在加载本周数据…</div>
        <div class="boot-sub">第一次打开或网络较慢时要等几秒，别急着关</div>
      </div>
    </div>
  </main>
</div>

<div id="modalRoot"></div>
<div id="toastRoot" class="toasts"></div>
<div id="loginRoot"></div>
<script src="config.js"></script>
  <script src="cloud-api.js"></script>
  <script type="module" src="cloud-extra.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
