name: keepalive

# 作用：Supabase 免费项目连续 7 天没有请求会被自动暂停（暂停后网站打不开）。
# 这个工作流每 3 天自动访问一次数据库，让它一直保持活跃。免费额度内，不花钱。

on:
  schedule:
    - cron: '17 3 */3 * *' # 每 3 天 03:17(UTC) 跑一次
  workflow_dispatch: # 也可以在 Actions 页面手动点一次

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          SB_URL: https://qcvefxutsncfbhfnrczh.supabase.co
          SB_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFjdmVmeHV0c25jZmJoZm5yY3poIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA0MTc4MTcsImV4cCI6MjA5NTk5MzgxN30.pjdqBGfpxR4IVSjSRf8dnMicndErvrEMK-pRY7gUQkU
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "$SB_URL/rest/v1/students?select=name&limit=1" \
            -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY")
          echo "HTTP $code"
          test "$code" = "200"
